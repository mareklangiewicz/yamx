  if (profile === 'B') return generateBalanced(entries);
  if (profile !== 'M') throw new TypeError('unknown profile');
  if (!Array.isArray(entries)) throw new TypeError('expected an array of entries');
  if (entries.length === 0) fail('E_EMPTY', 1, 'expected at least one entry');
  const seen = new Set();
  return Array.from(entries, (entry, index) => {
    if (!Array.isArray(entry) || entry.length !== 2)
      fail('E_SYNTAX', index + 1, 'expected a key/value pair');
    const [key, value] = entry;
    checkEntry(key, value, index + 1, seen);
    return `${key}: '${value}'\n`;
  }).join('');
}

return {parse,validate,generate};})();
})();

</script>
<script>
const profiles = {
  B: [
    ['A small catalog', "# Readable data, with room to grow\nname: YAMX\nactive: true\nretries: 3\nitems:\n  - shell\n  - javascript\noptional: null\n"],
    ['Nested records', "tools:\n  -\n    name: shell\n    portable: true\n  -\n    name: javascript\n    portable: true\nempty: {}\n"],
    ['Strings and quoting', "name: 'Marek''s tools'\nurl: https://example.org/a#fragment # a comment\nversion: '123'\ncount: 123\n"],
    ['An unsupported feature', 'name: "double quotes"\n']
  ],
  M: [
    ['A minimal catalog entry', "name: 'yamx'\nversion: '1.0'\nurl: 'https://example.org'\n"],
    ['Everything is a string', "active: 'true'\ncount: '123'\noptional: 'null'\n"]
  ]
};
const state = {variant:new URLSearchParams(location.search).get('variant') || 'A', profile:'B', example:0, text:profiles.B[0][1], valid:true, theme:'dark'};
if (!['A','B','C'].includes(state.variant)) state.variant='A';
const names={A:'Guided introduction',B:'Playground first',C:'Compact reference'};
const hero=()=>`<section class="hero"><div class="hero-copy"><div class="eyebrow">YAM(X) · A family of YAML subsets</div><h1>Readable data.<br>Small tools.</h1><p class="lead">Keep the YAML features you need. Leave the rest out. YAMX defines small, explicit profiles that independent shell and JavaScript tools can validate, parse and generate.</p><div class="hero-actions"><a class="cta" href="#playground">Edit an example ↓</a><a class="secondary" href="#profiles">Meet the profiles</a></div><p class="fine">Experimental · Two implemented profiles · No runtime packages</p></div></section>`;
const profileSection=()=>`<section class="section" id="profiles"><div class="section-intro"><h2>Two profiles. Explicit boundaries.</h2><p>Choose the features your data needs. B includes M and preserves its meanings; the specifications define that relationship.</p></div><div class="profile-pair"><article class="profile"><h3>YAM(B) — Balanced <span class="tag">Start here</span></h3><p>Nested collections, readable values and comments.</p><pre>name: YAMX\nactive: true\nitems:\n  - shell\n  - javascript</pre><ul><li>Maps and sequences, indented two spaces</li><li>Strings, safe integers, booleans and null</li><li>Comments and single-quoted strings</li></ul></article><article class="profile"><h3>YAM(M) — Minimal <span class="tag">Current default</span></h3><p>A tiny flat mapping. Every value is a string.</p><pre>name: 'yamx'\nactive: 'true'\ntool: 'shell'</pre><ul><li>Identifier keys and single-quoted strings</li><li>No nesting, comments or implicit types</li><li>A deliberately small grammar</li></ul></article></div><p class="fine">B is selected explicitly today. Profile names describe feature bundles; they do not define an inclusion hierarchy.</p></section>`;
const playground=()=>`<section class="section playground" id="playground"><div class="play-header"><div><h2>Try the boundaries.</h2><p>Edit an example or paste your own data. See what the selected profile accepts, then take the decoded data to JSON.</p></div></div><div class="controls"><label>Profile<select id="profile"><option value="B">B · Balanced</option><option value="M">M · Minimal</option></select></label><label>Example<select id="example"></select></label></div><div class="editors"><div class="editor"><div class="editor-head"><label for="source">YAMX input</label><span>editable</span></div><textarea id="source" spellcheck="false" autocomplete="off" aria-describedby="status"></textarea></div><div class="editor"><div class="editor-head"><span id="json-label">JSON output</span><button id="copy">Copy JSON</button></div><pre id="output" aria-labelledby="json-label" tabindex="0"></pre></div></div><div id="status" class="status" role="status"></div><div class="footnotes"><span>Your input stays in this page. Nothing is uploaded.</span><span>Printable ASCII · LF line endings · Final LF required</span></div><p class="fine" style="margin-top:12px">Prototype interaction only: profile/example changes load a fresh example. Exact editing and newline-fix behavior will be decided separately.</p></section>`;
const boundaries=()=>`<section class="section" id="boundaries"><h2>Small by design.</h2><div class="boundary"><div><h3>Predictable data</h3><p>Explicit grammar keeps the tooling manageable. Both profiles reject unsupported syntax. B leaves out anchors, tags, double-quoted and multiline strings, and nonempty flow collections.</p><p>B limits node depth to 32 and numbers to safe decimal integers. Both profiles currently accept overlong keys beyond YAML’s implicit-key limit; see the profile specifications.</p></div><div><h3>A bridge to other tools</h3><p>Export accepted documents as JSON while preserving their decoded data. JSON export is one-way. Parsing and generation within YAMX use its own documented representations.</p><div class="command"># Proposed JSON export command<br>sh src/yamx.sh --profile B json catalog.yaml</div><p>Shell uses POSIX utilities. JavaScript uses standard ES modules. Neither implementation needs a runtime package.</p></div></div><a href="https://github.com/mareklangiewicz/yamx/blob/prototype/pages-introduction/docs/balanced.md">Read B’s specification ↗</a> · <a href="https://github.com/mareklangiewicz/yamx/blob/prototype/pages-introduction/docs/minimal.md">Read M’s specification ↗</a><p class="fine" style="margin-top:12px">This is a preview for feedback. The specifications are in the repository; JSON CLI export is agreed and awaiting implementation.</p></section>`;
function render(){
  document.body.dataset.variant=state.variant;
  document.body.dataset.theme=state.theme;
  document.querySelector('#variant-label').textContent=`${state.variant} · ${names[state.variant]}`;
  const main=document.querySelector('main');main.className=`variant-${state.variant}`;
  const tracker='<div class="layout-state" id="review-state"></div>';
  if(state.variant==='A') main.innerHTML=hero()+playground()+profileSection()+boundaries()+tracker;
  if(state.variant==='B') main.innerHTML=hero()+playground()+`<div class="below">${profileSection()}${boundaries()}</div>`+tracker;
  if(state.variant==='C') main.innerHTML=`<aside class="sidebar"><div class="eyebrow">Field guide</div><a href="#main">01 · The idea</a><a href="#profiles">02 · Choose a profile</a><a href="#playground">03 · Try an example</a><a href="#boundaries">04 · Limits & tools</a><p class="fine">Experimental.<br>Small grammars.<br>Independent tools.</p></aside><article>${hero()}${profileSection()}${playground()}${boundaries()}${tracker}</article>`;
  const profile=document.querySelector('#profile');profile.value=state.profile;
  const examples=document.querySelector('#example');
  profiles[state.profile].forEach(([label],i)=>examples.add(new Option(label,i)));examples.value=state.example;
  const source=document.querySelector('#source');source.value=state.text;
  source.addEventListener('input',()=>{state.text=source.value;updateOutput();});
  profile.addEventListener('change',()=>{state.profile=profile.value;state.example=0;state.text=profiles[state.profile][0][1];render();});
  examples.addEventListener('change',()=>{state.example=Number(examples.value);state.text=profiles[state.profile][state.example][1];source.value=state.text;updateOutput();});
  document.querySelector('#copy').addEventListener('click',async()=>{const button=document.querySelector('#copy');try{await navigator.clipboard.writeText(document.querySelector('#output').textContent);button.textContent='Copied';}catch{button.textContent='Select output to copy';}});
  updateOutput();
}
// Prototype-only adapter; the public toJSON API has not been implemented.
function jsonValue(value){if(value instanceof Map)return Object.fromEntries([...value].map(([k,v])=>[k,jsonValue(v)]));if(Array.isArray(value))return value.map(jsonValue);return value;}
function updateOutput(){
  const status=document.querySelector('#status'),output=document.querySelector('#output'),copy=document.querySelector('#copy');copy.textContent='Copy JSON';
  try{const parsed=YamxPrototype.parse(state.text,state.profile);const value=state.profile==='M'?Object.fromEntries(parsed):jsonValue(parsed);output.textContent=JSON.stringify(value,null,2)+'\n';status.textContent=`✓ Valid YAM(${state.profile}) · JSON preview ready`;status.className='status';state.valid=true;copy.disabled=false;}
  catch(error){output.textContent='';status.textContent=error.message;status.className='status bad';state.valid=false;copy.disabled=true;}
  document.querySelector('#review-state').textContent=`Preview: ${names[state.variant]} · YAM(${state.profile}) · ${state.valid ? 'valid' : 'invalid'} input · theme: ${state.theme}`;
}
function switchVariant(step){const keys=['A','B','C'];state.variant=keys[(keys.indexOf(state.variant)+step+3)%3];const url=new URL(location);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render();scrollTo(0,0);}
document.querySelector('#previous').onclick=()=>switchVariant(-1);document.querySelector('#next').onclick=()=>switchVariant(1);
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowLeft'?-1:1);}});
document.querySelector('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';document.body.dataset.theme=state.theme;document.querySelector('#theme').textContent=state.theme==='dark'?'Light theme':'Dark theme';document.querySelector('#theme').setAttribute('aria-pressed',String(state.theme==='light'));updateOutput();};
render();
</script>
