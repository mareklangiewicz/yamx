name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [dash, bash]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check out ShellSpec 0.28.1
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: shellspec/shellspec
          ref: 90e48c950239f3b8a9fdfa3e869592872c77b981
          path: .tools/shellspec
          persist-credentials: false
      - name: Run executable specification and interoperability checks
        env:
          SHELLSPEC: .tools/shellspec/shellspec
          YAMX_SHELL: ${{ matrix.shell }}
        run: sh scripts/test.sh
